apiVersion: batch/v1
kind: Job
metadata:
  name: shard-validate-job
  labels:
    app: shard-validate
spec:
  completions: 8
  parallelism: 4
  completionMode: Indexed
  backoffLimit: 4
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: shard-validate
    spec:
      restartPolicy: Never
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app: shard-validate
      containers:
      - name: validator
        image: shard-validator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: DATA_DIR
          value: "/app/shards"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        resources:
          requests:
            cpu: "500m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "128Mi"
